[control]
receiver_address = "127.0.0.1:50051"
transmitter_address = "127.0.0.1:50052"

[massive]
rest_base_url = "https://api.massive.com"
stock_websocket_url = "wss://socket.massive.com/stocks"
future_websocket_url = "wss://socket.massive.com/futures"
forex_websocket_url = "wss://socket.massive.com/forex"
crypto_websocket_url = "wss://socket.massive.com/crypto"

# Prices stored in radio banks are integer units of each instrument's
# minimum_price_increment. Stocks use 1/200 USD so half-penny quote midpoints
# are exact. Currency pairs use pipettes: 1/100000 for non-JPY pairs and
# 1/1000 for JPY pairs. Futures use the contract's exchange tick size. Crypto
# pairs use the configured quote-currency increment below.

[[instruments]]
asset_class = "stock"
symbol = "SPY"
radio_symbol = 2
unit = "half_penny"
minimum_price_increment = { numerator = 1, denominator = 200 }

